# Site Settings
title: "Ziwen Xiong"
description: "Personal Academic Homepage"

url: "https://xzw1014.github.io"
baseurl: ""
repository: "xzw1014/xzw1014.github.io"

# Author
author:
  name: "Ziwen Xiong"
  avatar: "images/avatar.jpg"
  bio: "Ph.D. Student"
  location: "Hefei, China"
  email: "xiongzw@mail.ustc.edu.cn"
  github: "xzw1014"

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - docs
  - node_modules
  - vendor
  - README
  - LICENSE
  - Gemfile

encoding: "utf-8"

# Markdown
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

# URLs
permalink: /:categories/:title/
timezone: Asia/Shanghai

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
